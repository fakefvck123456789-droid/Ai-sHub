plugins {
    id "com.android.application"
}

android {
    namespace "com.aihub.local"
    compileSdk 35

    defaultConfig {
        applicationId "com.aihub.local"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
    }

    sourceSets {
        main.assets.srcDirs = ["src/main/assets", "../../app"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
}

plugins {
    id "com.android.application"
}

android {
    namespace "com.aihub.local"
    compileSdk 35

    defaultConfig {
        applicationId "com.aihub.local"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    sourceSets {
        main.assets.srcDirs = ["src/main/assets", "../../app"]
    }
}

dependencies {
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
}
